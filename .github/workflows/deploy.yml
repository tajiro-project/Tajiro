name: Deploy Tajiro

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tajiro-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      # ==========================================
      # 1. Repository Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. Node.js 20
      # ==========================================
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false

      # ==========================================
      # 4. sudo 권한 확인
      # ==========================================
      - name: Check sudo permission
        run: sudo -n true

      # ==========================================
      # 5. Backend application.properties 생성
      # ==========================================
      - name: Create backend application.properties
        working-directory: backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          BUILDING_LEDGER_SERVICE_KEY: ${{ secrets.BUILDING_LEDGER_SERVICE_KEY }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          MARKET_API_SERVICE_KEY: ${{ secrets.MARKET_API_SERVICE_KEY }}
          YOUTH_POLICY_API_KEY: ${{ secrets.YOUTH_POLICY_API_KEY }}

        run: |
          umask 077

          cat > src/main/resources/application.properties <<EOF
          app.name=Tajiro
          app.api-base-package=org.tajiro

          # ==========================================
          # Database
          # ==========================================
          db.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
          db.url=$DB_URL
          db.username=$DB_USERNAME
          db.password=$DB_PASSWORD

          # ==========================================
          # JWT
          # ==========================================
          jwt.secret=$JWT_SECRET
          jwt.access-token-validity-seconds=3600

          # ==========================================
          # Kakao / Building Ledger
          # ==========================================
          kakao.rest-api-key=$KAKAO_REST_API_KEY
          building-ledger.service-key=$BUILDING_LEDGER_SERVICE_KEY
          kakao.local-base-url=https://dapi.kakao.com

          # ==========================================
          # AI
          # ==========================================
          ai.api-key=$OPENAI_API_KEY
          ai.model=gpt-4o-mini
          ai.api-url=https://api.openai.com/v1/embeddings
          ai.embedding-model=text-embedding-3-small

          # ==========================================
          # Safety Aggregation
          # ==========================================
          safety.aggregation.batch-size=20
          safety.aggregation.fixed-delay-ms=60000
          safety.aggregation.initial-delay-ms=10000

          # ==========================================
          # Market API
          # ==========================================
          market.api.service-key=$MARKET_API_SERVICE_KEY
          market.api.service-key-encoded=false
          market.api.num-of-rows=1000

          market.rent-conversion-rate=0.05

          # ==========================================
          # Market Batch
          # ==========================================
          market.sync.enabled=true
          market.sync.history-months=24
          market.sync.refresh-months=3

          market.sync.cron=0 10 4 * * *
          market.sync.zone=Asia/Seoul

          # ==========================================
          # Youth Policy API
          # ==========================================
          youth-policy.api-url=https://www.youthcenter.go.kr/go/ythip/getPlcy
          youth-policy.api-key=$YOUTH_POLICY_API_KEY
          youth-policy.page-size=3000

          # ==========================================
          # Policy Batch
          # ==========================================
          policy.sync.enabled=false
          policy.sync.cron=0 10 4 * * *
          policy.sync.zone=Asia/Seoul
          policy.summary.batch-size=20

          # ==========================================
          # AWS S3 - Property Image Storage
          # ==========================================
          property.image.storage-type=s3
          property.image.s3.bucket=tajiro-property-images-709444203951-ap-northeast-2-an
          property.image.s3.region=ap-northeast-2
          property.image.s3.prefix=property-images

          spring.servlet.multipart.max-file-size=10MB
          spring.servlet.multipart.max-request-size=11MB
          EOF

      # ==========================================
      # 6. Backend WAR Build
      # ==========================================
      - name: Build backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean war --no-daemon

      # ==========================================
      # 7. Frontend 환경변수 생성
      # ==========================================
      - name: Create frontend environment
        working-directory: frontend
        env:
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
        run: |
          umask 077
          echo "VITE_KAKAO_MAP_KEY=$VITE_KAKAO_MAP_KEY" > .env.production

      # ==========================================
      # 8. Frontend Build
      # ==========================================
      - name: Build frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npm run build

      # ==========================================
      # 9. Backend Tomcat 배포
      # ==========================================
      - name: Deploy backend
        run: |
          WAR_FILE=$(find backend/build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.war" \
            ! -name "*-plain.war" \
            | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found"
            exit 1
          fi

          echo "Deploy WAR: $WAR_FILE"

          sudo systemctl stop tomcat

          sudo rm -rf /opt/tomcat/webapps/ROOT
          sudo rm -f /opt/tomcat/webapps/ROOT.war
          sudo rm -rf /opt/tomcat/work/Catalina/localhost/ROOT

          sudo cp "$WAR_FILE" /opt/tomcat/webapps/ROOT.war
          sudo chown tomcat:tomcat /opt/tomcat/webapps/ROOT.war

          sudo systemctl start tomcat

      # ==========================================
      # 10. Frontend Nginx 배포
      # ==========================================
      - name: Deploy frontend
        run: |
          sudo rm -rf /var/www/tajiro/*
          sudo cp -r frontend/dist/. /var/www/tajiro/

          sudo find /var/www/tajiro \
            -type d \
            -exec chmod 755 {} \;

          sudo find /var/www/tajiro \
            -type f \
            -exec chmod 644 {} \;

          sudo nginx -t
          sudo systemctl reload nginx

      # ==========================================
      # 11. Health Check
      # ==========================================
      - name: Health check
        run: |
          sleep 15

          sudo systemctl is-active --quiet tomcat
          sudo systemctl is-active --quiet nginx

          curl --fail \
            --silent \
            --show-error \
            http://127.0.0.1/ > /dev/null

          echo "Tajiro deployment successful"

      # ==========================================
      # 12. 생성된 Secret 파일 제거
      # ==========================================
      - name: Cleanup generated secret files
        if: always()
        run: |
          rm -f backend/src/main/resources/application.properties
          rm -f frontend/.env.production