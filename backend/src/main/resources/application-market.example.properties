# 실제 키는 application.properties, OS 환경변수 또는 ignored secret 파일에만 두세요.
# Decoding 키를 권장합니다. OS 환경변수 PUBLIC_DATA_API_KEY가 이 값보다 우선합니다.
market.api.service-key=
market.api.service-key-encoded=false
market.api.num-of-rows=1000

# 월세를 보증금 상당액으로 환산할 때 사용하는 연 전환율입니다. 0.05 = 5%
market.rent-conversion-rate=0.05

# true일 때만 등록 매물이 있는 시군구/유형을 정기 수집합니다.
market.sync.enabled=false
market.sync.history-months=24
market.sync.refresh-months=3
market.sync.initial-delay-ms=60000
market.sync.fixed-delay-ms=86400000

